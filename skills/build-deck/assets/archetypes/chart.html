<!-- ARCHETYPE: chart. An SVG spectrum with rungs, a callout panel, and a takeaway strip.
     data-steps="3": (1) chart, (2) emphasis + callout, (3) anchor dot + takeaway.
     SVG is authored at a fixed viewBox and scales down cleanly to a ~960px viewport. -->
<section class="slide" data-slide="chart" data-steps="3">
  <h1 style="margin-bottom:2%;">A spectrum, <span class="dim">not a binary</span></h1>
  <div style="flex:1; min-height:0; display:flex; gap:2.5%; align-items:flex-start;">
    <div data-step="1" style="flex:0 0 60%;">
      <svg viewBox="0 0 1000 600" style="width:100%; height:auto; display:block; overflow:visible;">
        <line x1="70" y1="540" x2="70" y2="40" stroke="var(--line)" stroke-width="2"/>
        <path d="M62,50 L70,34 L78,50 Z" fill="var(--text-dim)"/>
        <text x="34" y="290" text-anchor="middle" fill="var(--text-dim)" font-size="20" letter-spacing=".1em" transform="rotate(-90 34 290)">CAPABILITY</text>
        <line x1="70" y1="552" x2="960" y2="552" stroke="var(--line)" stroke-width="2"/>
        <path d="M960,544 L976,552 L960,560 Z" fill="var(--text-dim)"/>
        <text x="515" y="590" text-anchor="middle" fill="var(--text-dim)" font-size="20" letter-spacing=".1em">MATURITY</text>

        <rect x="86" y="440" width="330" height="86" rx="10" fill="rgba(59,130,246,.09)" stroke="rgba(147,197,253,.18)"/>
        <text x="104" y="490" fill="var(--text)" font-size="26" font-weight="600">Level one &mdash; assist</text>
        <rect x="86" y="330" width="470" height="86" rx="10" fill="rgba(59,130,246,.14)" stroke="rgba(147,197,253,.26)"/>
        <text x="104" y="380" fill="var(--text)" font-size="26" font-weight="600">Level two &mdash; draft</text>
        <rect x="86" y="220" width="610" height="86" rx="10" fill="rgba(59,130,246,.19)" stroke="rgba(147,197,253,.34)"/>
        <text x="104" y="270" fill="var(--text)" font-size="26" font-weight="600">Level three &mdash; do, supervised</text>
        <rect x="86" y="110" width="760" height="86" rx="10" fill="rgba(59,130,246,.25)" stroke="rgba(147,197,253,.42)"/>
        <text x="104" y="160" fill="var(--text)" font-size="26" font-weight="600">Level four &mdash; do, unattended</text>

        <rect data-step="2" x="84" y="218" width="614" height="90" rx="12" fill="none" stroke="var(--amber)" stroke-width="2.5"/>
        <rect data-step="2" x="84" y="108" width="764" height="90" rx="12" fill="none" stroke="var(--amber)" stroke-width="2.5"/>

        <circle data-step="3" cx="150" cy="483" r="9" fill="var(--green)" stroke="var(--bg)" stroke-width="2"/>
        <text data-step="3" x="170" y="483" dominant-baseline="central" fill="var(--green-lt)" font-size="20">where most tools actually sit today</text>
      </svg>
    </div>
    <div data-step="2" style="flex:1; align-self:flex-start; margin-top:2%; background:var(--panel-2); border:1px solid rgba(245,158,11,.4); border-radius:var(--radius); padding:22px 26px;">
      <div style="color:var(--amber-lt); letter-spacing:.12em; font-weight:700; font-size:clamp(16px,1.4vw,24px); margin-bottom:12px;">WHAT CHANGED</div>
      <div style="color:var(--text); font-size:clamp(17px,1.5vw,27px); line-height:1.4;">Name the recent shift that moved the frontier &mdash; and why it changes what's now possible.</div>
    </div>
  </div>
  <div data-step="3" style="margin-top:20px; border-left:4px solid var(--blue); padding:12px 24px; background:var(--panel-2); border-radius:0 var(--radius) var(--radius) 0;">
    <div style="font-size:clamp(19px,1.7vw,32px); color:var(--text);">For any claim you hear, <strong style="color:var(--amber-lt);">ask where it sits.</strong> Most confusion is two people pointing at different rungs with the same word.</div>
  </div>
</section>
