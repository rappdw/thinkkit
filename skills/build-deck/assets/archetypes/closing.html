<!-- ARCHETYPE: closing. A checklist that stays, beside a three-line spoken closer that lands.
     data-steps="2": (1) the list; (2) the closer (the list dims so the closer wins the eye). -->
<section class="slide" data-slide="closing" data-steps="2">
  <h1 style="margin-bottom:3.5%;">What it takes</h1>

  <div class="cl-body">
    <div class="cl-list">
      <div class="cl-row" data-step="1"><span class="cl-tick" style="--c:var(--blue-lt);">&check;</span><span class="cl-text"><b style="color:var(--blue-lt);">The first thing</b> &mdash; yours to own.</span></div>
      <div class="cl-row" data-step="1"><span class="cl-tick" style="--c:var(--green-lt);">&check;</span><span class="cl-text"><b style="color:var(--green-lt);">The second thing</b> &mdash; written down.</span></div>
      <div class="cl-row" data-step="1"><span class="cl-tick" style="--c:var(--purple-lt);">&check;</span><span class="cl-text"><b style="color:var(--purple-lt);">The third thing</b> &mdash; earned, not assumed.</span></div>
      <div class="cl-row" data-step="1"><span class="cl-tick" style="--c:var(--amber-lt);">&check;</span><span class="cl-text"><b style="color:var(--amber-lt);">The fourth thing</b> &mdash; a gate that blocks, not a policy that asks.</span></div>
      <div class="cl-row" data-step="1"><span class="cl-tick" style="--c:var(--cyan-lt);">&check;</span><span class="cl-text"><b style="color:var(--cyan-lt);">A named owner</b> &mdash; and a way to turn it off.</span></div>
    </div>

    <div class="cl-close" data-step="2">
      <div>Start <span style="color:var(--blue-lt);">small</span>.</div>
      <div>Start with <span style="color:var(--amber-lt);">the boring part</span>.</div>
      <div>Keep the judgment <span style="color:var(--green-lt);">human</span>.</div>
    </div>
  </div>

  <style>
    [data-slide="closing"] .cl-body { display:flex; gap:4%; flex:1; min-height:0; }
    [data-slide="closing"] .cl-list { width:54%; display:flex; flex-direction:column; justify-content:center; gap:14px; transition:opacity var(--step-ms) ease-out; }
    [data-slide="closing"] .cl-row { background:var(--panel-2); border:1.5px solid var(--line); border-radius:var(--radius); padding:14px 20px; display:flex; align-items:center; gap:16px; }
    [data-slide="closing"] .cl-tick { color:var(--c); font-weight:700; font-size:clamp(20px,2vw,30px); flex:0 0 auto; }
    [data-slide="closing"] .cl-text { font-size:clamp(18px,1.9vw,29px); line-height:1.3; }
    [data-slide="closing"] .cl-close { flex:1; display:flex; flex-direction:column; justify-content:center; gap:2.5%; }
    [data-slide="closing"] .cl-close div { font-size:clamp(34px,3.3vw,56px); font-weight:800; line-height:1.25; color:var(--text); }
    [data-slide="closing"]:has(.cl-close.on) .cl-list { opacity:.65; }
  </style>
</section>
